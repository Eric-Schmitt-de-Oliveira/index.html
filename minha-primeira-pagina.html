<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Clube Patinhas</h1>
    <!-- h1 é uma tag de título-->
    <!-- Um único h1 por página: o asssunto principal-->
    <!--Existem seis níveis de títulos (h1 ao h6)-->
    <!--Não se pula ordem: depois do h1 vem o h2, depois o h3 e etc...-->
      <h2> Como Cuidar </h2>
      <h3> Alimentação </h3>
      <p> Escove os dentes <em>só com pasta para cães</em></p>
      <h3> Passeios </h3>
      <p> Filhotes só passeiam <strong>com as vacinas em dia</strong>.</p>
      <!-- A tag strong é usada para negrito e em itálico -->
      <!-- A tag p é usada para parágrafos -->
    <ol>
      <li>Pegar a guia</li>
      <li>Passear</li>
      <li>Dar água</li>
    </ol>
    <!--Lista ordenada-->
    <h2> Raças</h2>
    <ul>
        <li>Beagle</li>
        <li>Poodle</li>
        <li>Vira-lata</li>
    </ul>
    <!--Lista não ordenada-->
    <!-- A tag "ul" abre a lista e "li" são os elementos da lista -->
     <dl> 
        <dt>Filhote</dt>
        <dd>Cão com menos de 1 ano</dd>
     </dl>
     <!--A tag "dt" é para o título e "dd" para a descrição-->

     <a href="https://pt.wikipedia.org/wiki/C%C3%A3o" target=""_blank" rel="noopener noreferrer">Sobre cães - Wikipedia</a>
     <!-- A tag "a" é para criar links -->
     <!-- No atributo "href", colocamos o endereço da página que queremos redirecionar -->
     <!-- O atributo target é usado para indicar se, ao clicar no link, a pagina abrirá na mesma aba/janela ou em uma nova aba/janela -->
     <!-- O atributo "nooper noreferrer" define que, ao clicar no link e abrir uma nova aba/janela, ele não poderá manipular a aba original(reverse tabnabbing) e impedirá que o site de destino saiba de qual página veio o tráfego original -->
     <img src="caramelo.jpg" alt="Um cachorro caramelo, representante oficial do Brasil.">
     <!-- A tag "img" é para colocar uma imagem no HTML -->
     <!-- O atributo alt deve sempre estar informado com uma descrição da imagem -->
</body>
</html>
